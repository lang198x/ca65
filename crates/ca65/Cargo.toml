[package]
name = "lang198x-ca65"
description = "The ca65 assembler family for Lang198x: one lossless parser for the cc65 suite's macro assembler, its CPU modes as a profile axis, lowering to asm198x-ir."
version = "0.0.19"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ca65", "6502", "assembler", "parser", "retro"]
categories = ["parsing"]

[dependencies]
lang198x-syntax = "0.1.3"
# A range, as in lang198x-z80-asm: Asm198x patches this to its own workspace
# copy, so its releases must still match. CI resolves the newest.
asm198x-ir = { version = ">=0.0.72, <0.1", optional = true }
# The instruction forms lowering chooses from; asm198x-ir names its types.
isa198x = { version = "0.1.8", optional = true }

[features]
# Lowering to asm198x-ir, for the Asm198x back end. Off by default, so tools
# that need only the tree build without any Asm198x crate.
ir = ["dep:asm198x-ir", "dep:isa198x"]


[dev-dependencies]
# Generated tests only, as approved in the shared syntax layer decision.
proptest = "1.12.0"

[lints]
workspace = true
